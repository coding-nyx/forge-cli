[package]
name = "forge-cli"
version = "0.1.0"
edition = "2021"
description = "A truly provider-agnostic, local-first orchestrator CLI."
authors = ["Forge Contributors"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
inquire = "0.7"
directories = "5.0"
walkdir = "2.5"
colored = "2.1"
termimad = "0.26"
indicatif = "0.17"
regex = "1.10"
lazy-regex = "3.1"

[dev-dependencies]
tokio-test = "0.4"
